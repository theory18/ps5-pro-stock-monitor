name: PS5 Pro voorraadcheck

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"  # elke 10 minuten op scheve minuten, weg van de drukte rond :00
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Stuur een testmail"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controleer voorraad
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_stock.py ${{ inputs.test_mail && '--test-mail' || '' }}

      - name: Sla status en README op
        run: |
          if [[ -n "$(git status --porcelain status.json README.md badges)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add status.json README.md badges
            git commit -m "Scan: $(python -c 'import json;print(json.load(open("status.json"))["stockLevelStatus"])')"
            git push
          fi
