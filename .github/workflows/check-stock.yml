name: PS5 Pro voorraadcheck

on:
  schedule:
    - cron: "*/5 * * * *"  # elke 5 minuten (minimum van GitHub, kan vertraging hebben)
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Stuur een testmail"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controleer voorraad
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BADGE_DIR: ${{ runner.temp }}/badges
        run: python check_stock.py ${{ inputs.test_mail && '--test-mail' || '' }}

      # Overschrijft de status-branch met één commit, zodat de README-badges de laatste scan tonen.
      - name: Publiceer badges
        working-directory: ${{ runner.temp }}/badges
        run: |
          git init -q -b status
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "Laatste scan"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status

      - name: Sla nieuwe status op
        run: |
          if [[ -n "$(git status --porcelain status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add status.json
            git commit -m "Status bijgewerkt: $(python -c 'import json;print(json.load(open("status.json"))["stockLevelStatus"])')"
            git push
          fi
